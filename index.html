<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f4bff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Weekln</title>
    <script>
      // Aplica o tema antes da pintura para não piscar (mesma chave de CHAVE_TEMA_LOCAL)
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem('calendario_sentimentos_tema');
        } catch (e) {}
        if (tema !== 'claro' && tema !== 'escuro') {
          tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        }
        document.documentElement.dataset.tema = tema;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
